<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Agende Já</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .chat-container {
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }

        .chat-sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
        }

        .chat-header-sidebar {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
        }

        .chat-header-sidebar h2 {
            margin: 0 0 10px 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 20px;
        }

        .user-info {
            font-size: 12px;
            opacity: 0.9;
        }

        .rooms-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .room-item {
            padding: 12px 15px;
            margin: 5px 0;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .room-item:hover {
            background: #f0f0f0;
            border-left-color: #fbbf24;
        }

        .room-item.active {
            background: rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
            font-weight: 600;
        }

        .room-item.new-message {
            background: #fff3cd;
            border-left-color: #ffc107;
        }

        .room-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .room-participants {
            font-size: 11px;
            color: #999;
        }

        .create-room-btn {
            margin: 10px;
            padding: 10px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .create-room-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-top-bar {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .chat-top-bar h3 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            color: #333;
        }

        .connection-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
        }

        .connection-status.offline {
            background: #ffebee;
            color: #c62828;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: #ece5dd;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
            margin: 4px 0;
        }

        .message.own {
            justify-content: flex-end;
        }

        .message.other {
            justify-content: flex-start;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            display: inline-block;
            width: auto;
            max-width: 100%;
            min-width: 60px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: brecoak-word;
            line-height: 1.35;
            font-size: 14px;
        }

        .message.own .message-bubble {
            background: #dcf8c6;
            color: #000;
            border-radius: 8px 0px 8px 8px;
        }

        .message.other .message-bubble {
            background: white;
            color: #000;
            border-radius: 0px 8px 8px 8px;
        }

        .message-meta {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
            padding: 0 4px;
        }

        .message.own .message-meta {
            text-align: right;
        }

        .message.other .message-meta {
            text-align: left;
        }

        .message-author {
            font-weight: 600;
            font-size: 13px;
            color: #555;
            margin-bottom: 2px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }

        .chat-send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .chat-send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #f57c00;
        }

        .btn-history {
            padding: 8px 16px;
            background: #4ecdc4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-history:hover {
            background: #45b8a8;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .empty-state h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .modal-buttons .btn-confirm {
            background: #fbbf24;
            color: white;
        }

        .modal-buttons .btn-confirm:hover {
            background: #f59e0b;
        }

        .modal-buttons .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .modal-buttons .btn-cancel:hover {
            background: #d0d0d0;
        }

        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
            }

            .chat-sidebar {
                width: 100%;
                max-height: 150px;
            }

            .rooms-container {
                display: flex;
                gap: 10px;
                overflow-x: auto;
                flex-direction: row;
            }

            .room-item {
                flex-shrink: 0;
                min-width: 150px;
            }

            .message-bubble {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="chat-sidebar">
            <div class="chat-header-sidebar">
                <h2>💬 Chats</h2>
                <div class="user-info">
                    <div id="userDisplayName">-</div>
                    <div id="connectionStatus">Conectando...</div>
                </div>
            </div>

            <div class="rooms-container" id="roomsContainer">
                <div style="padding: 20px; text-align: center; color: #999;">
                    Carregando salas...
                </div>
            </div>

            <button class="create-room-btn" onclick="showCreateRoomModal()">+ Nova Sala</button>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="chat-top-bar">
                <h3 id="currentRoomName">Selecione uma sala</h3>
                <div class="top-actions">
                    <button class="btn-logout" onclick="voltarAoDash()"> Voltar ao Dash</button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <h3>👋 Bem-vindo ao Chat</h3>
                    <p>Selecione uma sala para começar a conversar</p>
                </div>
            </div>

            <div class="chat-input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Digite sua mensagem..." 
                    disabled
                    onkeypress="handleMessageKeyPress(event)"
                >
                <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para criar nova sala -->
    <div class="modal-overlay" id="createRoomModal">
        <div class="modal-content">
            <h3>Nova Sala de Chat</h3>
            <input 
                type="text" 
                id="newRoomName" 
                placeholder="Nome da sala (ex: chat_cliente_123)"
                maxlength="100"
            >
            <input 
                type="text" 
                id="newRoomDescription" 
                placeholder="Descrição (opcional)"
                maxlength="200"
            >
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="createNewRoom()">Criar</button>
                <button class="btn-cancel" onclick="closeCreateRoomModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="chat.js"></script>
    <script>
        // Função para voltar ao dashboard
        function voltarAoDash() {
            console.log('[CHAT] Voltando ao dashboard...');
            
            // Parar polling de mensagens se existir
            if (typeof stopPollingMessages === 'function') {
                stopPollingMessages();
            }
            
            // Obter usuário do localStorage
            const userStr = localStorage.getItem('user');
            const user = userStr ? JSON.parse(userStr) : null;
            
            console.log('[CHAT] User role:', user ? user.role : 'não encontrado');
            
            // Redirecionar baseado na role do usuário
            if (user && user.role === 'profissional') {
                window.location.href = 'profissional_dashboard.html';
            } else {
                window.location.href = 'cliente_dashboard.html';
            }
        }
    </script>
</body>
</html>
